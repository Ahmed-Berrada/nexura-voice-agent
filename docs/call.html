<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexura - Lancer l'appel</title>
<!--
  Page de démo GRATUITE : lance un appel web Vapi (navigateur + micro) à la place
  d'un appel téléphonique sortant, en injectant les variables du lead
  (prénom, entreprise, activité, lead_id) => salutation personnalisée.

  Ouverte depuis la Sheet (menu Nexura > Lancer l'appel). Les données du lead
  arrivent dans le FRAGMENT d'URL (#...) : il n'est jamais envoyé au serveur.
  La clé PUBLIQUE Vapi est saisie une fois et gardée dans le navigateur
  (localStorage) : elle n'est jamais écrite dans le dépôt.
-->
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1a1f36; --muted:#5b6380; --brand:#1a237e; --ok:#1b8a4b; --err:#b3261e; --line:#dde1ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12141c; --card:#1c1f2b; --ink:#e8eaf2; --muted:#a0a7c0; --brand:#7c8cff; --ok:#4cc38a; --err:#ff8a80; --line:#2c3142; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); font:inherit; }
  button { font:inherit; padding:10px 18px; border-radius:8px; border:0; cursor:pointer; }
  #start { background:var(--brand); color:#fff; } #stop { background:var(--err); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #status { font-weight:600; } .ok { color:var(--ok); } .err { color:var(--err); }
  .meter { flex:1; min-width:140px; height:10px; border-radius:5px; background:var(--line); overflow:hidden; }
  .meter span { display:block; height:100%; width:0; background:var(--ok); transition:width .08s; }
  #log { max-height:320px; overflow:auto; font-size:.95rem; }
  #log p { margin:6px 0; } #log b { color:var(--brand); }
  details summary { cursor:pointer; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Nexura Cloud : appel de qualification</h1>
  <p class="sub">Appel web Vapi (micro du navigateur), utilisé à la place d'un appel téléphonique pour une démo gratuite.</p>

  <section class="card">
    <h2 style="font-size:1.05rem;margin:0 0 12px">Lead</h2>
    <div class="grid">
      <div><label for="first_name">Prénom</label><input id="first_name"></div>
      <div><label for="last_name">Nom</label><input id="last_name"></div>
      <div><label for="company_name">Entreprise</label><input id="company_name"></div>
      <div><label for="company_activity">Activité</label><input id="company_activity"></div>
      <div><label for="lead_id">lead_id</label><input id="lead_id"></div>
    </div>
  </section>

  <section class="card">
    <details id="cfg">
      <summary>Configuration Vapi (stockée uniquement dans ce navigateur)</summary>
      <div class="grid" style="margin-top:12px">
        <div><label for="pubkey">Clé PUBLIQUE Vapi</label><input id="pubkey" type="password" autocomplete="off"></div>
        <div><label for="assistant">Assistant ID</label><input id="assistant"></div>
      </div>
    </details>
  </section>

  <section class="card">
    <div class="row">
      <button id="start">Démarrer l'appel</button>
      <button id="stop" disabled>Raccrocher</button>
      <span id="status">Prêt</span>
    </div>
    <div class="row" style="margin-top:12px">
      <span style="font-size:.85rem;color:var(--muted)">Micro</span>
      <div class="meter"><span id="mic"></span></div>
    </div>
  </section>

  <section class="card">
    <h2 style="font-size:1.05rem;margin:0 0 8px">Transcription</h2>
    <div id="log"><p style="color:var(--muted)">La conversation s'affichera ici.</p></div>
  </section>
</main>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const FIELDS = ['first_name', 'last_name', 'company_name', 'company_activity', 'lead_id'];
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // 1. Données du lead depuis le fragment (#first_name=...&assistant=...), puis on efface l'URL.
  const hash = new URLSearchParams(location.hash.slice(1));
  FIELDS.forEach((f) => { $(f).value = hash.get(f) || ''; });
  if (hash.get('assistant')) store.set('vapi_assistant', hash.get('assistant'));
  if (location.hash) history.replaceState(null, '', location.pathname);
  $('pubkey').value = store.get('vapi_public_key');
  $('assistant').value = store.get('vapi_assistant');
  if (!$('pubkey').value || !$('assistant').value) $('cfg').open = true;
  $('pubkey').addEventListener('change', (e) => store.set('vapi_public_key', e.target.value.trim()));
  $('assistant').addEventListener('change', (e) => store.set('vapi_assistant', e.target.value.trim()));

  const setStatus = (txt, cls) => { $('status').textContent = txt; $('status').className = cls || ''; };
  const log = $('log');
  let firstLine = true;
  const say = (who, text) => {
    if (firstLine) { log.innerHTML = ''; firstLine = false; }
    const p = document.createElement('p');
    const b = document.createElement('b'); b.textContent = who + ' : ';
    p.append(b, document.createTextNode(text));
    log.append(p); log.scrollTop = log.scrollHeight;
  };

  let vapi = null;
  $('start').addEventListener('click', async () => {
    const key = $('pubkey').value.trim(), assistant = $('assistant').value.trim();
    if (!key || !assistant) { $('cfg').open = true; setStatus('Renseigne la clé publique et l\'assistant ID', 'err'); return; }
    store.set('vapi_public_key', key); store.set('vapi_assistant', assistant);
    $('start').disabled = true; setStatus('Connexion…');
    try {
      const { default: Vapi } = await import('https://cdn.jsdelivr.net/npm/@vapi-ai/web@3.1.0/+esm');
      vapi = new Vapi(key);
      vapi.on('call-start', () => { setStatus('En ligne', 'ok'); $('stop').disabled = false; });
      vapi.on('call-end', () => { setStatus('Appel terminé : le compte rendu part vers la Sheet'); $('stop').disabled = true; $('start').disabled = false; $('mic').style.width = '0'; });
      vapi.on('local-volume-level', (v) => { $('mic').style.width = Math.min(100, Math.round(v * 300)) + '%'; });
      vapi.on('message', (m) => {
        if (m.type === 'transcript' && m.transcriptType === 'final') say(m.role === 'assistant' ? 'Léa' : 'Prospect', m.transcript);
      });
      vapi.on('error', (e) => { console.error(e); setStatus('Erreur : ' + (e && (e.errorMsg || e.message || e.error && e.error.message) || 'voir la console'), 'err'); $('start').disabled = false; });
      const variableValues = {};
      FIELDS.forEach((f) => { variableValues[f] = $(f).value.trim(); });
      await vapi.start(assistant, { variableValues });
    } catch (e) {
      console.error(e); setStatus('Échec du démarrage : ' + (e.message || e), 'err'); $('start').disabled = false;
    }
  });
  $('stop').addEventListener('click', () => { if (vapi) vapi.stop(); });
</script>
</body>
</html>
